<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Plataforma de estudio para jueces de atletismo de la Liga de Atletismo del Meta. Reglamento World Athletics 2026, nomenclatura, guías y práctica.">
<meta name="keywords" content="atletismo, jueces, arbitros, reglamento, World Athletics, Liga Meta, Colombia, nomenclatura">
<meta name="author" content="Liga de Atletismo del Meta">
<meta property="og:title" content="Aula de Jueces - Liga de Atletismo del Meta">
<meta property="og:description" content="Plataforma interactiva de estudio para jueces de atletismo. Reglamento World Athletics 2026, siglas, quices y guías oficiales.">
<meta property="og:type" content="website">
<title>Aula de Jueces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: plano de marcación del estadio (izquierda) + planilla del puesto acoplada (derecha). En celular, plano arriba y planilla debajo. Firma: el plano se acerca al puesto elegido. */
:root{
  --ground:#E4E8E3; --stands:#D3D9D2; --stands-line:#C3CAC2; --apron:#BFC8BE; --paper:#F7F8F5; --sunk:#ECEFEA; --ink:#13201A; --muted:#4F5D55; --line:#CCD4CD;
  --track:#2D5DAE; --track-deep:#24498A; --lane:#FFFFFF; --grass:#4F8D50; --grass-2:#468448; --sand:#DCC48A; --water:#8CCBEA; --mat:#1E3048; --cage:#2B3A31;
  --mk-yellow:#F2C230; --mk-blue:#9CC2FF; --mk-green:#36B37E;
  --accent:#24498A; --accent-soft:#DFE7F5;
  --flag:#D99A00; --flag-soft:#FBEFC9; --card:#C21F37; --card-soft:#F8DCE1; --ok:#1B7A4F; --ok-soft:#D5EDE1;
  --board:#0F1512; --board-ink:#F4CB45;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0B110E; --stands:#141C18; --stands-line:#1C2621; --apron:#1E2823; --paper:#121A16; --sunk:#19231E; --ink:#E5EBE6; --muted:#9DAAA2; --line:#28352E;
  --track:#2A529A; --track-deep:#1F3F78; --lane:#DCE6F6; --grass:#2A532E; --grass-2:#264B2A; --sand:#9E8650; --water:#3E86AC; --mat:#0D1726; --cage:#A9B8AE;
  --mk-yellow:#E8B92A; --mk-blue:#9CC2FF; --mk-green:#3CC488;
  --accent:#93B4F2; --accent-soft:#1B2D4B;
  --flag:#F0BD33; --flag-soft:#372F14; --card:#F27186; --card-soft:#3B1B22; --ok:#5BCB97; --ok-soft:#14321F;
  --board:#040605; --board-ink:#F4CB45; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0B110E; --stands:#141C18; --stands-line:#1C2621; --apron:#1E2823; --paper:#121A16; --sunk:#19231E; --ink:#E5EBE6; --muted:#9DAAA2; --line:#28352E;
  --track:#2A529A; --track-deep:#1F3F78; --lane:#DCE6F6; --grass:#2A532E; --grass-2:#264B2A; --sand:#9E8650; --water:#3E86AC; --mat:#0D1726; --cage:#A9B8AE;
  --mk-yellow:#E8B92A; --mk-blue:#9CC2FF; --mk-green:#3CC488;
  --accent:#93B4F2; --accent-soft:#1B2D4B;
  --flag:#F0BD33; --flag-soft:#372F14; --card:#F27186; --card-soft:#3B1B22; --ok:#5BCB97; --ok-soft:#14321F;
  --board:#040605; --board-ink:#F4CB45; color-scheme:dark}
*{box-sizing:border-box}
html{accent-color:var(--accent);scrollbar-color:var(--line) transparent}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;caret-color:var(--accent)}
::selection{background:var(--mk-yellow);color:#13201A}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1;margin:0}
p{margin:0}
code{font-family:var(--f-mono);font-size:.9em}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mk-yellow);outline-offset:2px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Encabezado */
.top{max-width:1360px;margin:0 auto;padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;justify-content:space-between}
.title h1{font-size:clamp(2.4rem,5.4vw,3.6rem);font-weight:800;text-transform:uppercase;letter-spacing:-.005em}
.title p{color:var(--muted);font-size:.95rem;margin-top:6px}
.route-meter{display:grid;gap:6px;min-width:220px}
.route-meter .lbl{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted)}
.route-meter .lbl b{font-family:var(--f-display);font-size:1.3rem;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.segs{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.segs i{height:8px;border-radius:2px;background:var(--line);transition:background .3s}
.segs i.seen{background:color-mix(in srgb,var(--ok) 35%,var(--line))}
.segs i.on{background:var(--ok)}
.legend{display:flex;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--ok)}
.legend span.s::before{background:color-mix(in srgb,var(--ok) 35%,var(--line))}
/* Buscador */
.finder{position:relative;flex:1 1 300px;max-width:440px;min-width:0}
.finder input{width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:1rem}
.finder input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.finder svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.results{position:absolute;z-index:10;left:0;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -14px rgba(10,30,20,.4);padding:6px;display:grid;gap:2px;max-height:min(60vh,420px);overflow-y:auto}
.results[hidden]{display:none}
.results button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;min-height:44px}
.results button:hover,.results button.sel{background:var(--sunk)}
.results .kind{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:var(--muted);min-width:74px}
.results small{display:block;color:var(--muted);font-size:.82rem}
.results .none{padding:10px;color:var(--muted);font-size:.9rem}
.done-card{border-radius:12px;background:var(--ok-soft);padding:14px 16px;display:grid;gap:4px}
.done-card b{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase}

/* Escenario */
.stage{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:20px;align-items:start;padding-block:0 40px}
.map{position:sticky;top:12px;min-width:0;background:var(--stands);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--stands-line),0 12px 32px -18px rgba(10,30,20,.35)}
svg#stadium{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.map-bar{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.map-bar > *{pointer-events:auto}
.zoom-out{border:0;border-radius:99px;background:var(--paper);color:var(--ink);padding:7px 14px;font-family:var(--f-display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.map-note{font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:4px 9px;border-radius:99px}
.pin{cursor:pointer;outline:none}
.pin .ring{fill:var(--paper);stroke:var(--ink);stroke-width:2;transition:transform .2s cubic-bezier(.2,.9,.2,1)}
.pin .ico{fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pin .ico .fill{fill:var(--ink);stroke:none}
.pin .chk{display:none}
.pin.visited .ring{stroke:var(--ok);stroke-width:2.6}
.pin.visited .chk{display:block}
.pin .tip{opacity:0;transition:opacity .15s;pointer-events:none}
svg.zoomed .pin .tip{display:none}
.map.zoomed .map-note{display:none}
.pin .tip rect{fill:var(--ink)} .pin .tip text{fill:var(--paper);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.pin:hover .tip,.pin:focus-visible .tip,.pin.active .tip{opacity:1}
.pin:hover .ring,.pin:focus-visible .ring{transform:scale(1.12)}
.pin.active .ring{fill:var(--mk-yellow);stroke:var(--ink)}
.pin:focus-visible .ring{stroke:var(--mk-yellow);stroke-width:4}
.dim{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.dim-line{stroke:var(--muted);stroke-width:.8}
.stand-txt{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.24em;fill:var(--muted);text-anchor:middle}
.lane-num{font-family:var(--f-display);font-weight:700;font-size:6.5px;fill:var(--lane);text-anchor:middle;dominant-baseline:central}
.board-txt{font-family:var(--f-mono);font-size:12.5px;fill:var(--board-ink)}

/* Planilla acoplada */
.panel{position:sticky;top:12px;background:var(--paper);border-radius:16px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(10,30,20,.35);display:flex;flex-direction:column;max-height:calc(100vh - 24px);min-width:0;overflow:hidden}
.p-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:16px 18px 12px}
.p-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mk-yellow);color:#13201A}
.p-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.p-ico svg .fill{fill:currentColor;stroke:none}
.p-head h2{font-size:1.85rem;font-weight:800;text-transform:uppercase}
.p-head .where{font-size:.86rem;color:var(--muted);margin-top:4px}
.back{border:0;background:none;padding:0 18px;color:var(--accent);font-weight:700;cursor:pointer;text-align:left;font-size:.92rem}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs.more-right{-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.tabs button{border:0;background:none;padding:10px 10px 8px;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:1rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--track)}
.tabs button:hover{color:var(--ink)}
.p-body{overflow-y:auto;padding:16px 18px 26px;display:grid;gap:18px;align-content:start;overscroll-behavior:contain}
.p-body ul,.p-body ol{margin:0;padding-left:1.15em;display:grid;gap:7px}
.p-body h3{font-size:1.2rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.lede{font-size:1.04rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-family:var(--f-display);font-size:1.75rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kv span{font-size:.84rem;color:var(--muted)}
.note{background:var(--flag-soft);padding:10px 12px;border-radius:10px;font-size:.93rem}
.src{font-size:.82rem;color:var(--muted)}
.mods{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-1px)}
.mod b{font-family:var(--f-display);font-size:1.18rem;text-transform:uppercase;letter-spacing:.03em}
.mod small{color:var(--muted);font-size:.85rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.76rem;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.pill.dq{background:var(--card-soft);color:var(--card)} .pill.yc{background:var(--flag-soft);color:var(--ink)} .pill.l{background:var(--accent-soft);color:var(--accent)} .pill.dns{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--track-deep);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 200px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.terms{display:grid;gap:6px}
.term{display:grid;grid-template-columns:minmax(66px,auto) 1fr;gap:12px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.term b{font-family:var(--f-mono);color:var(--accent);word-break:break-word}
.term small{display:block;color:var(--muted);font-style:italic;font-size:.8rem}

/* Recorrido */
.route{list-style:none;padding:0!important;margin:0;display:grid;gap:2px!important;counter-reset:r}
.route li{counter-increment:r}
.route button{display:grid;grid-template-columns:30px 28px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;text-align:left}
.route button:hover{background:var(--sunk)}
.route .n{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.route .n::before{content:counter(r)}
.route svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.route svg .fill{fill:var(--ink);stroke:none}
.route .t{font-weight:700;font-size:.97rem;line-height:1.25}
.route .t small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.route .st{font-size:.78rem;color:var(--muted)}
.route .done .st{color:var(--ok);font-weight:700}
.headline{border-radius:12px;background:var(--board);color:#EDE9D6;padding:14px 16px;display:grid;gap:6px;cursor:pointer;border:0;text-align:left;width:100%}
.headline .k{font-family:var(--f-mono);font-size:.75rem;color:var(--board-ink);letter-spacing:.08em}
.headline b{font-size:1.02rem;line-height:1.35}

/* Quiz */
.q{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px}
.q .qt{font-weight:700;font-size:1.04rem}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--card);background:var(--card-soft)}
.opt:disabled{cursor:default}
.fb{font-size:.92rem;background:var(--sunk);border-radius:10px;padding:10px 12px}
.fb b.ok{color:var(--ok)} .fb b.no{color:var(--card)}
.score{font-family:var(--f-display);font-size:3.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* Marcador */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);display:grid;gap:8px}
.board label{font-size:.75rem;letter-spacing:.1em}
.board input{background:#000;color:var(--board-ink);border:1px solid #3a3a2a;border-radius:6px;padding:9px 10px;font-family:var(--f-mono);width:100%;caret-color:var(--board-ink)}
.board .tok{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:10px;font-size:.88rem;color:#F1ECD7}
.board .tok b{color:var(--board-ink)}
.board .tok small{display:block;color:#BDB79E}
.news-item{border-bottom:1px solid var(--line);padding-bottom:14px;display:grid;gap:6px}
.news-item:last-child{border-bottom:0}
.news-item .date{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.news-item h3{font-size:1.08rem;text-transform:none;font-family:var(--f-body);font-weight:700;letter-spacing:0;margin:0;line-height:1.3}
.news-item .tags{display:flex;gap:5px;flex-wrap:wrap}
.news-item .tags span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:99px}
.more{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-weight:700;font-size:.9rem;justify-self:start}
.news-form{display:grid;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:8px}
.news-form input,.news-form textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground)}
.news-form textarea{min-height:90px}
.linkbtn{background:none;border:0;color:var(--card);cursor:pointer;padding:0;font-size:.82rem}
.calc-row{display:flex;flex-wrap:wrap;gap:8px}
.calc-row select,.calc-row input{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--ground);min-width:0;max-width:100%}
.stage-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stage-cards div{background:var(--sunk);border-radius:10px;padding:10px}
.stage-cards b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;display:block;line-height:1}
footer{max-width:1360px;margin:0 auto;padding-block:0 28px;font-size:.82rem;color:var(--muted)}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  .map{position:relative;top:auto}
  .pin .tip{display:none}
  .p-body{overflow:visible}
  .map{border-radius:12px}
  .map-note{display:none}
}
@media (pointer:coarse){.seg button{min-height:44px;padding:8px 14px}.tabs button{min-height:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<header class="gut">
  <div class="top">
    <div class="title">
      <h1>Aula de Jueces</h1>
      <p>Liga de Atletismo del Meta · reglamento World Athletics 2026</p>
    </div>
    <div class="finder" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" type="search" placeholder="Buscar regla, sigla o tema: TR24.7, DNF, testigo…" aria-label="Buscar en el aula" autocomplete="off" aria-controls="q-res" aria-expanded="false">
      <div class="results" id="q-res" role="listbox" hidden></div>
    </div>
    <div class="route-meter" aria-live="polite">
      <div class="lbl"><span>Puestos aprobados</span><b id="m-num">0 de 14</b></div>
      <div class="segs" id="segs" aria-hidden="true"></div>
      <div class="legend"><span>Aprobado</span><span class="s">Visitado</span></div>
    </div>
  </div>
</header>

<main class="gut">
  <div class="stage">

  <h3>El equipo</h3><ul><li><b>Coordinador de salidas</b> (CR22): asigna funciones, ubica al juez de salida, los jueces de retirada (recall) y los auxiliares, y enlaza con foto-finish, cronometraje, anemómetro y TV.</li><li><b>Juez de salida</b>: decide sobre las salidas falsas. Todas las rondas de una prueba, y todas las series de una ronda, las sale la misma persona.</li><li><b>Jueces de retirada</b>: vigilan carriles asignados desde otros ángulos y pueden retirar la carrera.</li><li><b>Auxiliares de salida</b>: atleta correcto en serie y carril, dorsal y número de cadera, tacos según TR15, testigos listos y tarjetas mostradas.</li><li><b>Juez Árbitro de salidas</b>: revisa el SIS y el cero del disparo con el jefe de foto-finish, decide advertencias disciplinarias y puede dejar correr «bajo protesta».</li></ul>
  <h3>Voces de mando (TR16.2)</h3><ul><li>Hasta 400 m (incluye 4×200, relevo combinado y 4×400): «En sus marcas» y «Listos». Más de 400 m: solo «En sus marcas».</li><li>Si algo no está listo: «Arriba» (<i>Stand up</i>). En competiciones de ranking mundial las voces van en inglés; en las demás, en el idioma local, inglés o francés.</li><li>Agachados: ambas manos y al menos una rodilla en el suelo y los dos pies en las placas. En «Listos» se suben sin perder ese contacto.</li><li>No hay tiempo fijo entre voces: el disparo sale cuando todos están inmóviles.</li></ul>
  <h3>Salida falsa (TR16.7-16.8)</h3><ul><li>Comienza el movimiento de salida cuando un pie pierde contacto con la placa o una mano con el suelo (de pie: un pie con el suelo). Subir y bajar la cadera sin perder contacto no es salida falsa, pero puede ser advertencia disciplinaria.</li><li>Salvo en combinadas, el responsable queda descalificado: tarjeta <b>roja y negra</b> (partida en diagonal). En combinadas, la primera salida falsa es advertencia con tarjeta amarilla y negra a todos; la siguiente descalifica.</li><li>En salidas de pie, un desequilibrio accidental se considera salida «inestable»: no se sanciona. Si empujan a un atleta, no se le penaliza.</li></ul>
  <h3>Conducta en la salida (TR16.5)</h3><ul><li>Anular la salida sin razón válida, no acatar las voces o perturbar a otros: el juez anula la salida. Puede haber amarilla (DQ si se repite).</li><li>En TR16.5.1 y 16.5.2 nunca se muestra tarjeta verde. En TR16.5.3, si el atleta no provocó salida falsa de otros, se muestra verde.</li><li>Si la salida se anula por causa externa o ningún atleta es responsable: <b>tarjeta verde</b> a todos. Nunca hay verde si se mostró amarilla o roja.</li></ul>`},
 {id:"delegado",name:"Delegado Técnico",src:"Technical Delegates Guidelines, Athlete Replacement Policy (2025) y Competition Manipulation Watch List (2024)",sum:"Autoridad técnica de la competencia, reunión técnica, listas de salida, reemplazos y desempates a la milésima.",
  html:`<h3>Rol</h3><ul><li>Los Delegados Técnicos (DT) tienen la autoridad final sobre la parte técnica de la competencia y velan porque todo cumpla el reglamento y el Manual de Instalaciones.</li><li>Proponen horario y marcas mínimas, definen los implementos, controlan inscripciones, fijan marcas de clasificación en concursos (Q), alturas iniciales y progresiones, y organizan series y grupos de combinadas.</li><li>En Mundiales se reparten así: DT1 inscripciones, puntajes y resultados; DT2 campo de juego; DT3 oficiales y pruebas de ruta.</li><li>Aprueban los recorridos de maratón y marcha y verifican los certificados de calibración de los equipos de medición.</li></ul>
  <h3>Reunión técnica</h3><ul><li>Dos días antes en Mundiales y uno antes en otros eventos. Dura menos de una hora y no se aceptan preguntas desde la sala: se envían por escrito antes.</li><li>Incluye cambios de horario, procedimientos y horas de cámara de llamadas y sistemas de clasificación.</li></ul>
  <h3>Listas de salida y desempates</h3><ul><li>Los DT aprueban todas las listas de salida antes de distribuirlas. Siempre que se pueda, los atletas del mismo país van en series distintas.</li><li>Si dos atletas empatan a la centésima y eso afecta la clasificación o la siembra, se pide a foto-finish el tiempo a la milésima.</li></ul>
  <h3>Reemplazo de atletas (Serie WA, 2025)</h3><ul><li>Tras la Ronda 1 y semifinales de pista, y la clasificación de concursos, quedan <b>dos suplentes</b> para la siguiente ronda.</li><li>Si el último cupo fue por puesto, los suplentes salen por puesto; si fue por tiempo, por los siguientes tiempos; en concursos, por las siguientes marcas.</li><li>Si el Árbitro o el Jurado ya agregaron un atleta, no se reemplaza a nadie salvo que se retire un segundo.</li></ul>
  <h3>Integridad</h3><ul><li>Lista de vigilancia sobre manipulación de competencias: al 4 de diciembre de 2024 no hay ningún país incluido. Si una federación entra, World Athletics puede nombrar hasta 3 árbitros internacionales para sus competencias.</li></ul>`},
 {id:"arbitro",name:"Juez Árbitro (WAR)",src:"World Athletics Gold Referee Guidelines, diciembre 2025",sum:"Funciones del Árbitro de World Athletics, el Árbitro Jefe y qué controlar en cada área.",
  html:`<div class="kv"><div><b>4</b><span>niveles WARECS: Nacional (NAR), Bronce, Plata y Oro</span></div><div><b>8 años</b><span>de mandato; la lista Oro se actualiza cada 2 años</span></div><div><b>1 mes</b><span>antes: el Árbitro Jefe envía el rol de asignaciones a los Delegados Técnicos</span></div></div>
  <h3>Rol</h3><ul><li>Según CR8, el WAR es el Juez Árbitro de cada prueba asignada y vela porque se cumplan las Reglas de Competición, Técnicas, reglamentos y decisiones de los Delegados Técnicos.</li><li>Cuando está disponible, también se asigna como oficial adicional, sobre todo en carreras.</li><li>El <b>Árbitro Jefe</b> no puede desautorizar a otro WAR cuando este actúa como Juez Árbitro. Organiza reuniones previas con los árbitros nacionales y un balance diario tras la competencia.</li></ul>
  <h3>Asignaciones</h3><ul><li>Cámara de llamadas, carreras y marcha (uno como Árbitro de Salidas), un árbitro por concurso, combinadas y sala de video (uno para pista y otro para concursos).</li><li>Cámara de llamadas, video, carreras y salidas: el mismo árbitro toda la competencia, por coherencia.</li><li>En cada concurso, el mismo WAR en clasificación y final. En jabalina y disco conviene un segundo WAR en el área de caída.</li><li>Sin consenso entre árbitros decide el <b>Árbitro de Video</b> con las imágenes; en salidas decide el <b>Árbitro de Salidas</b>.</li></ul>
  <h3>Qué revisar en concursos</h3><ul><li>Verificación de la medición electrónica o por video (EDM/VDM) antes de cada prueba.</li><li>Uso y número correcto de marcas del atleta; tiempo permitido por intento.</li><li>Que los atletas ya clasificados no sigan lanzando o saltando en la ronda de clasificación.</li><li>Lanzamientos: control de implementos, sectores bien trazados, sin práctica durante la competencia, posición de las puertas de la jaula.</li><li>Saltos: preparación de tablas de batida, nivelado de la arena, subida uniforme del listón con dos grupos, sin práctica con garrocha durante la prueba.</li></ul>
  <h3>Posiciones sugeridas en carreras</h3><div class="tablewrap"><table><thead><tr><th>Prueba</th><th>Posiciones (A, B, C…)</th></tr></thead><tbody>
  <tr><td>200m</td><td>Inicio de 2.ª curva · mitad de curva · final de curva · 5 m después · vista frontal</td></tr>
  <tr><td>400m / 400mH</td><td>1.ª curva/recta final · 1.ª curva/recta opuesta · recta opuesta/2.ª curva · 2.ª curva/recta final</td></tr>
  <tr><td>800m</td><td>Igual que 400m, con B en la línea de calles libres</td></tr>
  <tr><td>100mH / 110mH</td><td>Vallas 1-3 · 4-6 · 7-10 · vista frontal o trasera</td></tr>
  <tr><td>3000mSC</td><td>Cada obstáculo (H1-H4) y uno en la ría (2.ª curva)</td></tr>
  <tr><td>4×100m</td><td>Uno por zona de transferencia más 1.ª curva</td></tr>
  <tr><td>5000m / 10,000m</td><td>Curvas y rectas, más uno o dos en conteo de vueltas</td></tr></tbody></table></div>`},
 {id:"inspectores",name:"Inspectores (Umpires)",src:"Umpire Guide, World Athletics",sum:"Quién coordina a los inspectores, dónde se ubican y cómo se reporta una infracción.",
  html:`<h3>Rol</h3><ul><li>El <b>Inspector Jefe</b> es el asistente del Juez Árbitro de pista: indica dónde se ubica cada inspector y coordina sus reportes.</li><li>Los inspectores son asistentes del Juez Árbitro. No descalifican: informan, y el Árbitro decide tras estudiar los hechos.</li></ul>
  <h3>Cómo se reporta</h3><ul><li>Levantando una <b>bandera amarilla</b> o por otro medio fiable aprobado por el Delegado Técnico, que alerta al Inspector Jefe y al Juez Árbitro.</li><li>En pista sintética se les da cinta adhesiva para marcar el punto exacto de la falta.</li><li>No reportar una infracción de cierta forma (o no reportarla) <b>no impide</b> una descalificación válida.</li></ul>
  <h3>Ubicación</h3><ul><li>Los diagramas de la guía son una posibilidad: el Director de Reunión asigna tantos jueces como pueda según la importancia, inscritos y oficiales disponibles.</li><li>En carreras de más de 800 m, algunos inspectores alrededor de la pista vigilan empujones y obstrucciones.</li><li>Si los relevos cierran la jornada, conviene reunir como inspectores a los oficiales que ya terminaron sus funciones.</li></ul>`},
 {id:"crono",name:"Cronometraje manual",src:"Manual Timekeeping Guide",sum:"Cualidades del cronometrador, cuántos se necesitan y cómo se determina el tiempo oficial.",
  html:`<div class="kv"><div><b>9</b><span>cronometradores para 6 carriles (3 relojes por atleta)</span></div><div><b>12</b><span>para 8 carriles</span></div><div><b>10 / 13</b><span>si el Cronometrador Jefe solo toma al ganador</span></div><div><b>30 min</b><span>antes del inicio: hora de presentarse</span></div></div>
  <h3>Reglas y buenas prácticas</h3><ul><li>Reaccionar a la llegada del atleta, sin anticiparla: el reloj se detiene al ver que el atleta alcanza la línea.</li><li>Ningún tiempo se comunica a nadie distinto del Cronometrador Jefe. Solo él divulga los tiempos oficiales.</li><li>Si un cronometrador se distrae en la salida o la llegada, debe anunciar «tiempo no registrado» al Jefe de inmediato.</li><li>El cronometrador no se interesa en quién gana: el puesto lo deciden los jueces de llegada.</li><li>En pruebas cortas, cada cronometrador toma un solo tiempo: el reflejo humano no separa con precisión a dos atletas a menos de 0.2 s.</li><li>Desde 3000 m se toman tiempos intermedios cada kilómetro.</li></ul>
  <h3>El Cronometrador Jefe</h3><ul><li>Toma los tiempos a la centésima, los anota, los convierte a la décima y determina el tiempo de cada atleta.</li><li>Antes de la reunión revisa relojes, banderines en los puntos intermedios y los récords que pueden caer. Los récords mundiales con cronometraje manual se reconocen desde 1500 m.</li><li>Puede preparar una tabla de progresión vuelta a vuelta. Ejemplo para 5000 m en 13:25: 16.10 cada 100 m, 1:04.40 cada 400 m.</li><li>Al final firma la hoja de récords y la hace firmar por los cronometradores.</li></ul>`},
 {id:"llegada",name:"Jueces de llegada y conteo de vueltas",src:"Lap Scoring Guide",sum:"Cómo se reparten los puestos entre jueces y cómo se controla a los atletas doblados.",
  html:`<h3>Reparto de puestos</h3><div class="tablewrap"><table><thead><tr><th>Juez</th><th>Puestos que toma</th></tr></thead><tbody>
  <tr><td>Juez Jefe</td><td>1.º</td></tr><tr><td>Juez 1</td><td>1.º y 2.º</td></tr><tr><td>Juez 2</td><td>2.º y 3.º</td></tr><tr><td>Juez 3 a 7</td><td>el suyo y el siguiente (3.º-4.º … 7.º-8.º)</td></tr><tr><td>Juez 8</td><td>8.º</td></tr></tbody></table></div>
  <ul><li>El Juez Jefe reúne los resultados, determina los puestos y lleva los tiempos con el Cronometrador Jefe a la hoja de la prueba.</li><li><b>Nunca</b> se juzga «por carril».</li><li>Aunque haya cronometraje automático, se necesitan jueces de llegada: desde 800 m los atletas llegan por los carriles 1 y 2 y los números de cadera se caen, se mojan o quedan tapados.</li></ul>
  <h3>Fondo y atletas doblados</h3><ul><li>Se lleva un registro vuelta a vuelta con hora aproximada de paso, para detectar doblados e indicar las vueltas restantes.</li><li>Desde 5000 m se fotografía a cada atleta que cruza la meta, aunque haya corrido vueltas de más.</li><li>La última vuelta se señala a cada atleta, normalmente con una campana.</li><li>El método simple (anotar dorsales en orden de paso y retiros) es solo para jueces con experiencia y <b>no</b> se usa en 20 km ni en la carrera de 1 hora.</li></ul>`},
 {id:"foto",name:"Foto-finish",src:"IAAF Photo Finish Guidelines, junio 2015",sum:"El Juez Internacional de Foto-finish, las pruebas de cero y cómo leer el torso.",
  html:`<div class="kv"><div><b>1000</b><span>líneas por segundo como mínimo (mejor 2000)</span></div><div><b>0.001 s</b><span>precisión mínima de lectura</span></div><div><b>1 · 4 · 8</b><span>carriles del «run through» de alineación</span></div><div><b>30 min</b><span>puede tardar la luz artificial en recuperarse en pista cubierta</span></div></div>
  <h3>Roles</h3><ul><li>El <b>Juez Internacional de Foto-finish (IPFJ)</b> es el Juez Jefe: decide el orden de llegada y supervisa el sistema, el proveedor y al juez nacional.</li><li>El juez nacional (NPFJ) mantiene contacto con los Árbitros de pista y de salidas sobre descalificaciones.</li><li>La cámara oficial suele ser la exterior; la segunda queda de respaldo.</li></ul>
  <h3>El torso</h3><ul><li>Extremo superior: la articulación externa de la clavícula, más o menos entre el tercio medio y el exterior de la distancia cuello-hombro.</li><li>Extremo inferior: la línea de la cadera, en su parte más ancha.</li><li>El cursor no va sobre el borde del dorsal si el torso no está en contacto con él.</li><li>Si no se pueden separar dos atletas, es empate: el cursor queda en la misma posición para ambos.</li><li>Silla de ruedas: cuenta el centro del eje de la rueda delantera. Ciegos: el torso del atleta debe llegar antes que el del guía; si no, se informa al Árbitro.</li></ul>
  <h3>Durante la sesión</h3><ul><li>Prueba de cero en todas las cámaras antes de cada sesión, con foto rotulada para los Delegados Técnicos.</li><li>En clasificaciones por tiempo muy cerradas, se relee a la milésima y se deja una ampliación en el TIC para posibles reclamaciones.</li><li>Récords: dos copias de la foto para récord de área, tres para récord mundial.</li><li>Atletas que no salen o abandonan se registran como DNS o DNF; la descalificación la decide el Árbitro de pista.</li></ul>`},
 {id:"marcha",name:"Marcha atlética",src:"Reglamento 2026 (TR54), enmiendas sep. y dic. 2025, y Race Walking Guide (IAAF, 2016)",sum:"Definición, paletas amarillas, tarjetas rojas, Juez Jefe y zona de penalización según TR54 2026.",
  html:`<div class="note">La guía de jueces de 2016 citaba la antigua Regla 230. Este módulo sigue la <b>TR54 del reglamento 2026</b> y usa la guía solo para buenas prácticas.</div>
  <h3>Definición (TR54.2)</h3><p>La marcha es una progresión de pasos en la que el atleta mantiene contacto con el suelo, sin pérdida de contacto visible al ojo humano. La pierna adelantada debe estar recta (sin flexionar la rodilla) desde el primer contacto con el suelo hasta que pasa por la posición vertical.</p>
  <div class="kv"><div><b>6</b><span>jueces en pista (con el Juez Jefe)</span></div><div><b>6-9</b><span>jueces en ruta</span></div><div><b>1-2 km</b><span>circuito en ruta; menos de 1 km solo con aprobación del DT</span></div><div><b>3</b><span>rojas de 3 jueces distintos: zona de penalización o DQ</span></div></div>
  <h3>Paletas y tarjetas</h3><ul><li><b>Paleta amarilla</b>: cuando el juez no está totalmente seguro de que el atleta cumple. Una sola por infracción a cada atleta (pérdida de contacto <code>~</code> y rodilla flexionada <code>&gt;</code>). Desde 2025 se recomienda mostrarla antes de la roja siempre que sea posible.</li><li><b>Tarjeta roja</b>: lleva número del juez, dorsal, infracción y hora. <b>Tiene efecto desde que el juez la escribe</b>, incluida la que descalifica. No se comunica al atleta. Un juez no envía dos rojas al mismo atleta.</li><li>En competiciones de alto nivel, dos rojas de jueces de la misma federación nunca bastan para descalificar.</li><li>El <b>Juez Jefe</b> puede descalificar en los últimos 100 m sin importar las rojas recibidas (TR54.4.1).</li></ul>
  <h3>Zona de penalización (TR54.7.3)</h3><div class="tablewrap"><table><thead><tr><th>Carreras hasta</th><th class="num">Tiempo</th></tr></thead><tbody>
  <tr><td>5000 m / 5 km</td><td class="num">0.5 min</td></tr><tr><td>10.000 m / 10 km</td><td class="num">1 min</td></tr><tr><td>Media maratón</td><td class="num">2 min</td></tr><tr><td>30.000 m / 30 km</td><td class="num">3 min</td></tr><tr><td>Maratón</td><td class="num">4 min</td></tr><tr><td>50.000 m / 50 km</td><td class="num">5 min</td></tr></tbody></table></div>
  <ul><li>Con tres rojas, el Juez Jefe o su delegado avisa y el atleta entra a la zona por el tiempo que corresponda.</li><li>Una <b>cuarta roja</b>, de un juez distinto a los tres anteriores, descalifica (TR54.7.5).</li><li>Si no entra o sale antes y <b>sigue en carrera</b>: DQ por el Juez Árbitro. Si en cambio abandona, se anota DNF.</li><li>Si la tercera roja llega cuando ya no se puede enviar a la zona, el Árbitro suma ese tiempo a su marca final.</li><li>Distancias estándar desde 2026: pista 5000 m, 10.000 m, media maratón, maratón y 50.000 m; ruta 10 km, media maratón, maratón y 50 km.</li></ul>
  <h3>Buenas prácticas (guía 2016)</h3><ul><li>En caso de duda, el beneficio es para el atleta.</li><li>Buen ángulo: unos 45° respecto al atleta que se acerca; en pista, desde los carriles exteriores.</li><li>Zonas críticas: aceleración de salida, adelantamientos, sprint final, dentro de un grupo, curvas, giros y puestos de avituallamiento.</li><li>Nunca se juzga por parejas, desde un vehículo, corriendo junto al atleta ni acostado en el suelo.</li><li>Los marchistas no pueden usar prendas que tapen la rodilla; las mallas largas ajustadas sí se permiten (TR5.1).</li><li>Tablero de tarjetas rojas a unos 100 m antes de la meta. En ruta, el tiempo se redondea al segundo superior: 1:22:44.32 → 1:22:45.</li></ul>`},
 {id:"hora",name:"Carrera de una hora",src:"One Hour Race Guide",sum:"Montaje, equipos de oficiales, conteo de vueltas y medición de la distancia en 60 minutos.",
  html:`<div class="kv"><div><b>400 m</b><span>pista exacta</span></div><div><b>20</b><span>atletas máximo por carrera</span></div><div><b>40</b><span>oficiales aproximados</span></div><div><b>59′ y 60′</b><span>disparos del juez de salida</span></div></div>
  <h3>Antes y durante</h3><ul><li>Se anuncia como 20.000 m y una hora. Cada equipo (un cronometrador con dos relojes de doble acción y un anotador) sigue como máximo a 4 atletas.</li><li>La hoja de vueltas cuenta de 49 a 1 las vueltas restantes de los 20.000 m. El marcador de vueltas arranca en 50.</li><li>El locutor anuncia el tiempo del líder cada kilómetro y cuando faltan 5, 4, 3 y 2 minutos.</li><li>A los 45-50 minutos, cada oficial recibe una estaca numerada y sigue a su atleta caminando en sentido contrario por el césped.</li></ul>
  <h3>Medición</h3><ul><li>Al disparo de los 60 minutos, la estaca se clava en el último contacto del atleta, a 50 cm del carril interior.</li><li>Se mide desde la línea de meta a 30 cm del bordillo y se redondea al metro completo inferior.</li><li>Ejemplo: 3 vueltas restantes en 59:20.6 y 2 en 60:35.4, más 221 m → 47 vueltas + 221 m = <b>19.021 km</b>.</li><li>Todos los oficiales permanecen en la pista hasta que el Árbitro confirme los resultados.</li></ul>`},
 {id:"instalaciones",name:"Instalaciones y equipos",src:"Track and Field Facilities Manual (2008, 2019, cap. 6.3 de 2020, pista corta 2026) y Form of Conformity (CR28)",sum:"Marcas de la pista, zonas de transferencia, jaulas de lanzamiento, salas y verificación de la medición.",
  html:`<h3>Colores de marcas en pista de 400 m</h3><div class="tablewrap"><table><thead><tr><th>Marca</th><th>Color</th></tr></thead><tbody>
  <tr><td>Vallas 110mH</td><td>Azul (rojo en pistas azules)</td></tr><tr><td>Vallas 100mH</td><td>Amarillo</td></tr><tr><td>Vallas 400mH</td><td>Verde</td></tr>
  <tr><td>Zonas de transferencia 4×100 m</td><td>Amarillo</td></tr><tr><td>Zonas 4×400 m y relevos no corridos por carril</td><td>Azul (rojo en pistas azules)</td></tr><tr><td>Línea de calles libres (800 m, 4×400 m)</td><td>Verde</td></tr></tbody></table></div>
  <ul><li><b>Zona 4×100 m</b>: empieza 20 m antes de la línea de inicio de la posta y termina 10 m después (30 m en total).</li><li><b>Zona 4×400 m (2.º atleta)</b>: 10 m antes y 10 m después de la línea.</li><li>Radio de la curva de la pista estándar: 36.500 m.</li></ul>
  <h3>Pista corta de 200 m</h3><ul><li>Radio de medición en carril 1: 17.500 m; peralte de 10°; carriles de 1.00 m en el óvalo y 1.22 m en la recta.</li><li>60mH mujeres: 5 vallas, 13.00 m a la primera y 8.50 m entre vallas. Hombres: 13.72 m y 9.14 m.</li></ul>
  <h3>Jaula de martillo (cap. 6.3)</h3><ul><li>Debe detener un martillo de 7.26 kg a 32 m/s (3.72 kJ).</li><li>Red de al menos 7 m de alto atrás y 10 m en los paneles junto a las puertas; puertas móviles de 2 m de ancho y 10 m de alto.</li><li>Boca de 6 m medida a 7 m delante del centro del círculo; mínimo 3.50 m del centro a la red; red a 0.60 m de los postes.</li><li>Revisar materiales antes de cada temporada, la red antes de cada competencia y probar el material de la red al menos una vez al año.</li></ul>
  <h3>Salas de competencia (manual 2008)</h3><ul><li>Cámara de llamadas: 1.2 m² por atleta; unos 80 m² para atletas de 3 pruebas a la vez.</li><li>Control antidopaje: sala de espera para hasta 15 atletas (unos 2 m² por persona), sala de trabajo de unos 18 m² y al menos 2 baños de 4.50 m².</li></ul>
  <h3>Verificación de la medición (CR28)</h3><ul><li>Antes de la prueba, el Juez de Medición (científica) supervisa medidas de control con los jueces y bajo el Juez Árbitro, comparándolas con una cinta de acero calibrada.</li><li>Se registran 3 medidas de control a lo largo del rango esperado y se emite un <b>Formulario de Conformidad</b> firmado por el proveedor, el Juez de Medición, el Juez Jefe y el Juez Árbitro, que se adjunta a la hoja de resultados.</li></ul>
  <h3>Superficies</h3><ul><li>Mineral no ligada: varias capas permeables, de material grueso abajo a fino arriba, con partículas angulares.</li><li>Césped natural: aceptable para competir y muy usado en entrenamiento, calentamiento y el área central de lanzamientos.</li><li>Tope de bala, especificación 1983/84: 1.22 m ± 0.01 de largo, aceptable bajo la nota de la regla.</li></ul>`},
 {id:"tv",name:"Cobertura de televisión",src:"Athletics Broadcast Coverage Manual",sum:"Lo que un juez debe saber sobre la ventana de transmisión y la narrativa televisiva.",
  html:`<div class="kv"><div><b>120 min</b><span>ventana en horario estelar</span></div><div><b>10-12</b><span>pruebas: unas 8 de pista y 4 de concursos</span></div><div><b>3-4 h</b><span>puede durar el mitin completo</span></div></div>
  <h3>Por qué le importa al juez</h3><ul><li>Las presentaciones previas tienen límite: velocidad 3 minutos, otras carreras y concursos 2:30. Las salidas y llamados deben estar listos a tiempo.</li><li>Las pruebas de segundo nivel y clasificaciones se programan fuera de la ventana de 120 minutos.</li><li>Los <b>spotters</b> informan al director de lo que pasa en la cancha, como cuándo sube el listón o una lesión. Los oficiales no deben tapar las cámaras, sobre todo la frontal de llegada.</li><li>La narrativa sigue tres partes: comienzo (series y clasificaciones), mitad (semifinales y rondas intermedias) y final.</li></ul>`}

function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
// punto en la curva derecha: phi=0 abajo, phi=PI arriba

function setVB(v){vb=v;svg.setAttribute("viewBox",v.map(n=>n.toFixed(2)).join(" "));sizePins();const z=vb[2]<999;svg.classList.toggle("zoomed",z);$(".map").classList.toggle("zoomed",z);}
function zoomTo(t){
  if(anim) cancelAnimationFrame(anim);
  if(reduce){setVB(t);return;}
  const from=vb.slice(),t0=performance.now(),D=650;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=p===1?1:1-Math.pow(2,-10*p);setVB(from.map((f,i)=>f+(t[i]-f)*e));if(p<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}

function runQuiz(container,pool,n,onEnd){
  const qs=shuffle(pool).slice(0,n); let i=0,ok=0;

      container.innerHTML=`<div class="q"><div class="score">${ok}/${qs.length}</div><p>${pct>=60?"Bien juzgado.":"Repasa la guía y vuelve a intentarlo: se aprueba con 60 %."}</p><div class="row"><button class="btn" type="button" data-again>Otra ronda</button></div></div>`;

const TMAP={};T.forEach(t=>t[0].split(/\s*[·/]\s*/).forEach(c=>{const k=c.trim();if(k&&!TMAP[k])TMAP[k]=t;}));
TMAP["CR"]=["CR","Según el contexto: récord del campeonato, regla de competición o cámara de llamadas","Championship Record / Competition Rule / Call Room","gen",""];
function decodeStr(raw){
  const toks=raw.trim().split(/\s+/).filter(Boolean),out=[];
  const rule=c=>{const ex=D.filter(r=>r[0].split(/[\s·\[\]]+/).includes(c));return ex.length?ex:D.filter(r=>r[0].startsWith(c));};
  for(let i=0;i<toks.length;i++){let t=toks[i];
    if(t==="DQ"&&/^TR[\d.]+$/i.test(toks[i+1]||"")){const r=toks[i+1].toUpperCase(),hs=rule(r);out.push(["DQ "+r,"Descalificado por la regla "+r,hs.slice(0,3).map(x=>x[3]).join(" · ")]);i++;continue;}
    if(/^(TR|CR)[\d.]+$/i.test(t)){const u=t.toUpperCase(),hs=rule(u);out.push([u,(u[0]==="T"?"Regla técnica ":"Regla de competición ")+u.slice(2),hs.slice(0,3).map(x=>x[3]).join(" · ")]);continue;}
    let eq="";if(t.startsWith("=")&&t.length>1){eq="Igualó: ";t=t.slice(1);}
    const m=t.match(/^(\d{1,2}:)?(\d{1,2}:)?\d+\.\d+([a-zA-Z]*)$/);
    if(m){const suf=m[3]||"",base=t.slice(0,t.length-suf.length),p=[];if(suf.includes("w"))p.push("viento > 2 m/s");if(suf.includes("W"))p.push("combinadas con viento > 4 m/s");if(suf.includes("A"))p.push("altitud > 1000 m");if(suf.includes("i"))p.push("pista cubierta");out.push([t,"Marca "+base,p.length?"Condición: "+p.join(", "):"Sin códigos especiales"]);continue;}
    const hit=TMAP[t]||TMAP[t.toUpperCase()];
    out.push(hit?[eq?"="+t:t,eq+hit[1],hit[2]]:[t,"No reconocido","Revisa mayúsculas: Q y q no significan lo mismo"]);
  }
  return out;
}
function renderDecoder(body){
  body.innerHTML=`<div class="board"><label for="dec">ESCRIBE UNA ANOTACIÓN DE RESULTADOS</label><input id="dec" value="DQ TR24.7" autocomplete="off" spellcheck="false"><div id="dout" style="display:grid;gap:6px"></div></div><div class="seg" id="dex">${["DQ TR16.8","qR","=WR","10.21w","2.31A","NM","DQ TR7.1 YRC","x o -"].map(e=>`<button type="button">${e}</button>`).join("")}</div>`;
  const draw=()=>{$("#dout").innerHTML=decodeStr($("#dec").value).map(o=>`<div class="tok"><b>${esc(o[0])}</b><span>${esc(o[1])}${o[2]?`<small>${esc(o[2])}</small>`:""}</span></div>`).join("");};
  $("#dec").oninput=draw;$("#dex").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#dec").value=b.textContent;draw();};draw();
}

/* ---------- Centro técnico: rondas ---------- */
function renderCalc(body){
  body.innerHTML=`<p class="src">Apéndice 5 del reglamento de la Serie WA: series por ronda y cuántos pasan por puesto (P) y por tiempo (T).</p><div class="calc-row"><select id="ce" aria-label="Prueba">${Object.entries(PROG).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("")}</select><input id="cn" type="number" min="1" max="200" value="30" aria-label="Inscritos" style="width:100px"></div><div id="co"></div>`;
  const calc=()=>{const p=PROG[$("#ce").value],n=parseInt($("#cn").value,10),o=$("#co");
    if(!n){o.innerHTML=`<p class="src">Escribe el número de inscritos.</p>`;return;} if(n<p.rows[0][0]){o.innerHTML=`<p>Con ${n} inscritos: final directa.</p>`;return;}
    const r=p.rows.find(x=>n>=x[0]&&n<=x[1]);if(!r){o.innerHTML=`<p class="src">La tabla llega hasta ${p.rows[p.rows.length-1][1]} inscritos; con más, el Delegado Técnico define el sistema.</p>`;return;}
    const r1=r[2]*r[3]+r[4],semi=r.length>5,r2=semi?r[5]*r[6]+r[7]:null;
    o.innerHTML=`<div class="stage-cards"><div><span class="src">Ronda 1</span><b>${r[2]} series</b><span>${r[3]} P${r[4]?` + ${r[4]} T`:""} → ${r1}</span></div>${semi?`<div><span class="src">Semifinal</span><b>${r[5]} series</b><span>${r[6]} P${r[7]?` + ${r[7]} T`:""} → ${r2}</span></div>`:""}<div><span class="src">Final</span><b>${semi?r2:r1}</b><span>atletas</span></div></div>`;};
  $("#ce").onchange=calc;$("#cn").oninput=calc;calc();
}

/* ---------- Calentamiento ---------- */
function renderPractice(body){
  const best=store.get("aj-best",{});
  body.innerHTML=`<p class="lede">Rondas de 10 preguntas con la regla citada en cada respuesta. Se aprueba con 6.</p><div class="calc-row"><select id="pm" aria-label="Módulo"><option value="all">Todos los módulos</option>${Object.entries(MODS).map(([k,v])=>`<option value="${k}">${v}${best[k]!=null?` · ${best[k]} %`:""}</option>`).join("")}</select><button class="btn" type="button" id="pgo">Empezar ronda</button></div><div id="pa"></div>`;
  $("#pgo").onclick=()=>startPractice($("#pm").value);
}
function startPractice(mod){
  const sel=$("#pm");if(sel)sel.value=mod;
  runQuiz($("#pa"),Q.filter(q=>mod==="all"||q.m===mod),10,pct=>{const best=store.get("aj-best",{});if(mod!=="all"&&(best[mod]==null||pct>best[mod])){best[mod]=pct;store.set("aj-best",best);}if(pct>=60)markPassed("calent");});
}

/* ---------- Marcador: noticias ---------- */
let db=null,canEdit=false,newsDocs=null,newsTag="all",newsState="Cargando noticias…";
function fmtDate(s){const d=new Date(s+"T12:00:00");return isNaN(d)?(s||""):d.toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"});}
function renderNewsTab(body){
  body.innerHTML=`${canEdit?`<details><summary class="more">+ Publicar noticia</summary><form class="news-form" id="nf"><input id="nf-t" required maxlength="160" placeholder="Título" aria-label="Título"><input id="nf-d" type="date" required aria-label="Fecha"><textarea id="nf-r" required maxlength="2000" placeholder="Resumen para los jueces" aria-label="Resumen"></textarea><input id="nf-u" type="url" placeholder="Enlace de la fuente (https://…)" aria-label="Enlace de la fuente"><input id="nf-tags" placeholder="Etiquetas separadas por coma" aria-label="Etiquetas"><div class="row"><button class="btn" type="submit">Publicar</button><span class="src" id="nf-msg"></span></div></form></details>`:""}<div class="seg" id="ntags"></div><div id="nlist" style="display:grid;gap:14px"></div>`;
  if(canEdit){$("#nf-d").value=new Date().toISOString().slice(0,10);$("#nf").onsubmit=async e=>{e.preventDefault();const m=$("#nf-msg"),b=e.target.querySelector("button");m.textContent="Publicando…";b.disabled=true;
    try{await db.collection("noticias").add({titulo:$("#nf-t").value.trim(),fecha:$("#nf-d").value,resumen:$("#nf-r").value.trim(),fuente:$("#nf-u").value.trim(),fuenteNombre:"",etiquetas:$("#nf-tags").value.split(",").map(s=>s.trim()).filter(Boolean),creado:new Date().toISOString()});m.textContent="Publicada.";e.target.reset();$("#nf-d").value=new Date().toISOString().slice(0,10);}catch(err){m.textContent="No se pudo publicar: solo los editores de la página pueden hacerlo.";}b.disabled=false;};}
  drawNews();
}
function drawNews(){
  const list=$("#nlist");if(!list)return;
  if(!newsDocs){list.innerHTML=`<p class="src">${esc(newsState)}</p>`;return;}
  if(!newsDocs.length){list.innerHTML=`<p class="src">Aún no hay noticias publicadas.</p>`;return;}
  const tags=[...new Set(newsDocs.flatMap(d=>(d.data()||{}).etiquetas||[]))].sort((a,b)=>a.localeCompare(b,"es"));
  const tb=$("#ntags");tb.innerHTML="";["all",...tags].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t==="all"?"Todas":t;b.setAttribute("aria-pressed",String(t===newsTag));b.onclick=()=>{newsTag=t;drawNews();};tb.append(b);});
  const docs=newsTag==="all"?newsDocs:newsDocs.filter(d=>((d.data()||{}).etiquetas||[]).includes(newsTag));
  list.innerHTML="";
  docs.forEach(d=>{const n=d.data()||{};const a=document.createElement("article");a.className="news-item";
    const dt=document.createElement("span");dt.className="date";dt.textContent=fmtDate(n.fecha);
    const hh=document.createElement("h3");hh.textContent=n.titulo||"";
    const p=document.createElement("p");const full=n.resumen||"";const short=full.length>240?full.slice(0,240).replace(/\s+\S*$/,"")+"…":full;p.textContent=short;
    a.append(dt,hh,p);
    if(full!==short){const mb=document.createElement("button");mb.type="button";mb.className="more";mb.textContent="Leer completa";mb.onclick=()=>{p.textContent=full;mb.remove();};a.append(mb);}
    if(Array.isArray(n.etiquetas)&&n.etiquetas.length){const tg=document.createElement("div");tg.className="tags";n.etiquetas.forEach(x=>{const s=document.createElement("span");s.textContent=x;tg.append(s);});a.append(tg);}
    const row=document.createElement("div");row.className="row";
    if(n.fuente&&/^https?:\/\//.test(n.fuente)){const l=document.createElement("a");l.href=n.fuente;l.target="_blank";l.rel="noopener";l.textContent=n.fuenteNombre?("Fuente: "+n.fuenteNombre):"Ver fuente";row.append(l);}
    if(canEdit){const del=document.createElement("button");del.type="button";del.className="linkbtn";del.textContent="Eliminar";del.onclick=async()=>{if(del.dataset.c!=="1"){del.dataset.c="1";del.textContent="¿Eliminar? Toca otra vez";return;}try{await db.collection("noticias").doc(d.id).delete();}catch(e){del.textContent="No se pudo eliminar";}};row.append(del);}
    a.append(row);list.append(a);});
}
function setBoard(){const t=$("#board-text");if(!t||!newsDocs||!newsDocs.length)return;const s=((newsDocs[0].data()||{}).titulo||"").toUpperCase();t.textContent="▶ "+(s.length>24?s.slice(0,23)+"…":s);}
async function initNews(){
  try{
    if(!window.claude||!window.claude.use){newsState="Las noticias aparecen en la página publicada.";drawNews();return;}
    db=await window.claude.use("db");const user=await window.claude.use("user");canEdit=user?!!(await user.canEdit()):false;
    if(!db){newsState="Inicia sesión en claude.ai para ver las noticias.";drawNews();return;}
    db.collection("noticias").orderBy("fecha","desc").onSnapshot(s=>{newsDocs=s.docs;setBoard();
      if(!current)renderHome();else if(current.id==="marcador")drawNews();
    },()=>{newsState="No se pudieron cargar las noticias. Recarga la página.";drawNews();});
  }catch(e){newsState="No se pudieron cargar las noticias.";drawNews();}
}

/* ================= BUSCADOR ================= */
const MOD2SPOT={}; SPOTS.forEach(s=>(s.mods||[]).forEach(m=>{if(!MOD2SPOT[m])MOD2SPOT[m]=s.id;})); MOD2SPOT.tv="video";
function searchAll(q){
  const n=norm(q.trim()); if(n.length<2) return [];
  const out=[];
  SPOTS.forEach(s=>{if(norm(s.name+" "+s.why+" "+(s.k||"")).includes(n)) out.push({kind:"Puesto",t:s.name,d:s.why,go:()=>openSpot(s.id,null,true)});});
  D.forEach(r=>{if(norm(r[0]+" "+r[3]+" "+r[4]).includes(n)) out.push({kind:"Regla",t:r[0]+" · "+r[1],d:r[3],go:()=>{prefill=r[0].split(/[\s·\[]/)[0];openSpot("secretaria","dq",true);}});});
  T.forEach(t=>{if(norm(t[0]).startsWith(n)||norm(t[0])===n||norm(t[1]+" "+t[2]).includes(n)) out.push({kind:"Sigla",t:t[0],d:t[1],go:()=>{prefill=t[0];openSpot("secretaria","terms",true);}});});
  G.forEach(g=>{if(norm(g.name+" "+g.sum+" "+g.html.replace(/<[^>]+>/g," ")).includes(n)) out.push({kind:"Guía",t:g.name,d:g.sum,go:()=>{openSpot(MOD2SPOT[g.id]||"tic",null,true);readGuide(g.id);}});});
  (newsDocs||[]).forEach(d=>{const x=d.data()||{};if(norm((x.titulo||"")+" "+(x.resumen||"")).includes(n)) out.push({kind:"Noticia",t:x.titulo||"",d:fmtDate(x.fecha),go:()=>openSpot("marcador","news",true)});});
  const rank={Sigla:0,Regla:1,Puesto:2,"Guía":3,Noticia:4};
  return out.sort((a,b)=>{const ea=norm(a.t)===n||norm(a.t).startsWith(n)?0:1, eb=norm(b.t)===n||norm(b.t).startsWith(n)?0:1;return ea-eb||rank[a.kind]-rank[b.kind];}).slice(0,10);
}
let qRes=[],qSel=0;
function drawResults(){
  const box=$("#q-res"),inp=$("#q");
  if(!inp.value.trim()){box.hidden=true;inp.setAttribute("aria-expanded","false");return;}
  qRes=searchAll(inp.value); box.hidden=false; inp.setAttribute("aria-expanded","true");
  box.innerHTML=qRes.length?qRes.map((r,i)=>`<button type="button" role="option" class="${i===qSel?"sel":""}" data-i="${i}"><span class="kind">${r.kind}</span><span>${esc(r.t)}<small>${esc(r.d)}</small></span></button>`).join(""):`<div class="none">Nada coincide con «${esc(inp.value.trim())}». Prueba con el número de regla (TR24.7), una sigla (DNF) o una palabra (testigo).</div>`;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
}
function pick(i){const r=qRes[i];if(!r)return;$("#q-res").hidden=true;$("#q").value="";$("#q").setAttribute("aria-expanded","false");r.go();}
$("#q").addEventListener("input",()=>{qSel=0;drawResults();});
$("#q").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();qSel=Math.min(qSel+1,qRes.length-1);drawResults();}
  else if(e.key==="ArrowUp"){e.preventDefault();qSel=Math.max(qSel-1,0);drawResults();}
  else if(e.key==="Enter"){e.preventDefault();pick(qSel);}
  else if(e.key==="Escape"){$("#q").value="";drawResults();}
});
document.addEventListener("click",e=>{if(!e.target.closest(".finder"))$("#q-res").hidden=true;});

/* ================= INICIO ================= */
drawStadium(); requestAnimationFrame(()=>{sizePins();fitPanel();}); renderProgress(); renderHome(); initNews();
const start=location.hash.slice(1); if(SPOTS.some(s=>s.id===start)) openSpot(start);
})();
